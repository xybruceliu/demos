<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- the walkie-talkie strip in two bars: you (blue) and the AI (green), overlapping, each speaking into the other's turn -->
  <style>
    .you { fill: #3566f0 } .ai { fill: #219761 }
    @media (prefers-color-scheme: dark) { .you { fill: #6fa4fc } .ai { fill: #58c38b } }
  </style>
  <rect class="you" x="3" y="8" width="18" height="7" rx="3.5" />
  <rect class="ai" x="11" y="17" width="18" height="7" rx="3.5" />
</svg>
